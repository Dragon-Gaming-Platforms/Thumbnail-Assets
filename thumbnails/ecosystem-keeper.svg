  <text x="50" y="108" fill="#f0f6dc" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing=".6">ECOSYSTEM</text>
  <text x="50" y="157" fill="#f0f6dc" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="2">KEEPER</text>
  <text x="53" y="186" fill="#b6d0bb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">WATER · SOIL · SPECIES</text>
