<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Ecosystem Keeper</title>
  <desc id="desc">A managed biome with grass, wetland water, wildlife and a connected food web, inspired by the game's ecosystem succession simulation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d17"/>
      <stop offset=".55" stop-color="#1d3827"/>
      <stop offset="1" stop-color="#101f1c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83bca6"/>
      <stop offset="1" stop-color="#d7d69b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5da6a1"/>
      <stop offset="1" stop-color="#266c6f"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dce8cf" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <rect width="800" height="260" fill="url(#grain)"/>
  <path d="M0 228H800" stroke="#a6c87c" stroke-opacity=".4"/>
  <path d="M29 25V235" stroke="#a6c87c" stroke-width="4"/>

