<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">REAL DOS/Windows on Scratch</title>
  <desc id="desc">A retro blue-bordered DOS console listing a directory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000022"/><stop offset=".57" stop-color="#000066"/><stop offset="1" stop-color="#000022"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#c0c0c0" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#c0c0c0" stroke-width="4"/>
  <text x="52" y="51" fill="#c0c0c0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">EMULATION · SCRATCH BUILD</text>
  <text x="50" y="106" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">REAL DOS</text>
  <text x="50" y="152" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">ON SCRATCH</text>
  <text x="53" y="182" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">8086 · C:\&gt; · WIN</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#0000aa"/><rect x="340" y="45" width="410" height="170" fill="#000"/><text x="352" y="64" font-family="monospace" font-size="12" fill="#c0c0c0">Starting MS-compatible DOS...</text><text x="352" y="83" font-family="monospace" font-size="12" fill="#c0c0c0">HIMEM is testing extended memory...done.</text><text x="352" y="102" font-family="monospace" font-size="12" fill="#c0c0c0">C:\>dir</text><text x="352" y="121" font-family="monospace" font-size="12" fill="#c0c0c0"> GAMES        &lt;DIR&gt;     03-11-94</text><text x="352" y="140" font-family="monospace" font-size="12" fill="#c0c0c0"> WIN          &lt;DIR&gt;     03-11-94</text><text x="352" y="159" font-family="monospace" font-size="12" fill="#c0c0c0"> AUTOEXEC BAT       220 03-11-94</text><text x="352" y="178" font-family="monospace" font-size="12" fill="#c0c0c0">C:\>win</text><text x="352" y="197" font-family="monospace" font-size="12" fill="#c0c0c0">C:\>_</text><rect x="690" y="140" width="50" height="22" rx="4" fill="#ff8c1a"/><text x="715" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">8086</text>
  </g>
</svg>
