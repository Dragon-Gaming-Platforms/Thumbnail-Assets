<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Scheduling Lab</title>
  <desc id="desc">A Gantt chart of overlapping project tasks on a timeline.</desc>
