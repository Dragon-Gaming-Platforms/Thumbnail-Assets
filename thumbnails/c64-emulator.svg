<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Commodore 64 Emulator</title>
  <desc id="desc">A blue retro BASIC screen beside a generic beige keyboard computer, with a note that no ROMs are included.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a2a"/><stop offset=".57" stop-color="#20206a"/><stop offset="1" stop-color="#0a0a2a"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#7070ff" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#7070ff" stroke-width="4"/>
  <text x="52" y="51" fill="#7070ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">RETRO EMULATOR · BYOROM</text>
  <text x="50" y="106" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">C64</text>
  <text x="50" y="152" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">EMULATOR</text>
  <text x="53" y="182" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">KEYBOARD · TOUCH · GAMEPAD</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#1a1a1f"/><rect x="360" y="50" width="250" height="160" rx="6" fill="#4040e0" stroke="#555" stroke-width="6"/><rect x="366" y="56" width="238" height="148" fill="#4040e0"/><rect x="380" y="70" width="210" height="120" fill="#7070ff"/><text x="388" y="88" font-family="monospace" font-size="11" fill="#c0c0ff">**** 64K RAM SYSTEM ****</text><text x="388" y="104" font-family="monospace" font-size="11" fill="#c0c0ff">38911 BASIC BYTES FREE</text><text x="388" y="120" font-family="monospace" font-size="11" fill="#c0c0ff">READY.</text><text x="388" y="136" font-family="monospace" font-size="11" fill="#c0c0ff">LOAD "*",8,1</text><text x="388" y="152" font-family="monospace" font-size="11" fill="#c0c0ff"></text><text x="388" y="168" font-family="monospace" font-size="11" fill="#c0c0ff">█</text><rect x="640" y="150" width="110" height="46" rx="6" fill="#d7ccc8"/><rect x="650" y="156" width="40" height="8" rx="2" fill="#4040e0"/><circle cx="730" cy="173" r="8" fill="#333" stroke="#111" stroke-width="2"/><text x="695" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#cfd8dc" letter-spacing="1.5">COMMODORE 64</text><text x="695" y="90" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#78909c">NO ROMS INCLUDED</text><text x="695" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#78909c">LOAD YOUR OWN FILE</text>
  </g>
</svg>
