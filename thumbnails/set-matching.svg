<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Set Matching</title>
  <desc id="desc">Three cards with different counts, shapes, colors and fills circled as a set.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2a"/><stop offset=".57" stop-color="#3a2a4a"/><stop offset="1" stop-color="#1a1a2a"/></linearGradient>
<pattern id="stripe" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#43a047" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
