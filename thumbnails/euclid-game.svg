<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Euclid Game</title>
  <desc id="desc">A gold rectangle cut into squares, illustrating the Euclidean algorithm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a00"/><stop offset=".57" stop-color="#5a3a10"/><stop offset="1" stop-color="#2a1a00"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ffd54f" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ffd54f" stroke-width="4"/>
  <text x="52" y="51" fill="#ffd54f" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">TWO-PLAYER MATH GAME</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">EUCLID</text>
  <text x="50" y="160" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">GAME</text>
  <text x="53" y="190" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">CUT SQUARES · PERFECT OPPONENT</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#fffde7"/><rect x="380" y="50" width="360" height="160" fill="#ffd54f" stroke="#333" stroke-width="2"/><rect x="380" y="50" width="160" height="160" fill="#ffb300" stroke="#333" stroke-width="2"/><rect x="540" y="50" width="160" height="160" fill="#ffb300" stroke="#333" stroke-width="2"/><rect x="700" y="50" width="40" height="40" fill="#ff8f00" stroke="#333" stroke-width="2"/><rect x="700" y="90" width="40" height="40" fill="#ff8f00" stroke="#333" stroke-width="2"/><rect x="700" y="130" width="40" height="40" fill="#ff8f00" stroke="#333" stroke-width="2"/><rect x="700" y="170" width="40" height="40" fill="#ff8f00" stroke="#333" stroke-width="2"/><text x="460" y="135" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#5d4037">9 × 4</text>
  </g>
</svg>
