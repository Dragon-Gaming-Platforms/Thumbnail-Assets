  </g>
  <circle cx="409.5" cy="132.5" r="27" fill="url(#emberGlow)"/>
  <path d="M409 144Q396 134 405 123Q412 116 409 107Q427 120 422 132Q432 128 433 119Q441 136 426 145Z" fill="#f16d43"/>
  <path d="M411 140Q407 134 413 126Q420 133 417 140Z" fill="#ffd37b"/>
