  <path d="M386 180L390 175L394 180L390 185Z" fill="#e9e0c8"/>
  <circle cx="466" cy="85" r="8" fill="#a64c45" stroke="#f0c096" stroke-width="2"/>
  <path d="M462 85L466 80L470 85L466 90Z" fill="#241b20"/>
  <circle cx="447" cy="104" r="8" fill="#a64c45" stroke="#f0c096" stroke-width="2"/>
  <path d="M443 104L447 99L451 104L447 109Z" fill="#241b20"/>
  <path d="M371 199H390M390 180L409 161M409 161V142" fill="none" stroke="#f1cd7a" stroke-width="2" stroke-dasharray="3 4"/>
  <rect x="400" y="123" width="19" height="19" fill="none" stroke="#ffd77b" stroke-width="2"/>

  <g transform="translate(516 71)">
    <text x="0" y="0" fill="#9facb4" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">SQUAD STATUS</text>
    <g transform="translate(0 16)">
      <circle cx="12" cy="10" r="8" fill="#6ec4b5"/><path d="M9 10L12 6L15 10L12 14Z" fill="#f1eedf"/>
      <text x="29" y="14" fill="#e5e2d9" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">WARDEN</text>
      <rect x="102" y="5" width="91" height="8" rx="4" fill="#37414a"/><rect x="102" y="5" width="74" height="8" rx="4" fill="#64bd9c"/>
    </g>
    <g transform="translate(0 47)">
      <circle cx="12" cy="10" r="8" fill="#5f9eb8"/><path d="M8 10L15 7L13 11L16 13Z" fill="#eee7d0"/>
      <text x="29" y="14" fill="#e5e2d9" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">ARCHER</text>
      <rect x="102" y="5" width="91" height="8" rx="4" fill="#37414a"/><rect x="102" y="5" width="58" height="8" rx="4" fill="#66a9c5"/>
    </g>
    <path d="M0 83H205" stroke="#75838a" stroke-opacity=".35"/>
    <text x="0" y="101" fill="#d2c5ac" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">COVER · FIRE · SEAL</text>
    <g transform="translate(0 116)">
      <rect width="46" height="25" rx="6" fill="#332c28" stroke="#b0714d"/>
      <path d="M13 18Q8 11 14 6Q20 3 17 0Q28 8 22 18Z" fill="#f07843"/>
      <rect x="56" width="46" height="25" rx="6" fill="#223542" stroke="#617f8e"/>
      <path d="M67 12L75 4L84 12L75 20Z" fill="none" stroke="#76c9c2" stroke-width="2"/>
      <rect x="112" width="46" height="25" rx="6" fill="#3a2d20" stroke="#c29b54"/>
      <path d="M125 12H145M135 5V20" stroke="#edcc78" stroke-width="2"/>
    </g>
  </g>
  <rect x="2" y="2" width="796" height="256" rx="13" fill="none" stroke="#e6ddca" stroke-opacity=".15"/>
