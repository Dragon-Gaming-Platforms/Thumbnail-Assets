<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Ember Tactics</title>
  <desc id="desc">A tactical squad advances over an eight-by-eight ashland board toward a protected ember while avoiding hazards and enemies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset=".57" stop-color="#2a2022"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27303a"/>
      <stop offset="1" stop-color="#171d27"/>
    </linearGradient>
    <radialGradient id="emberGlow">
      <stop offset="0" stop-color="#ff9c43" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff533f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ash" width="19" height="19" patternUnits="userSpaceOnUse">
      <path d="M19 0H0V19" fill="none" stroke="#c6c3ad" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#e0a452" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#e0a452" stroke-width="4"/>

  <text x="52" y="51" fill="#f2bd72" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">SQUAD COMMAND · 01</text>
  <text x="50" y="109" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">EMBER</text>
  <text x="50" y="158" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="1.7">TACTICS</text>
  <text x="53" y="187" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SQUAD · COVER · OBJECTIVE</text>
  <g transform="translate(56 212)">
    <circle cx="0" cy="0" r="5" fill="#78c8bd"/>
    <path d="M10 0H47" stroke="#78c8bd" stroke-width="2"/>
    <path d="M54-6L60 0L54 6L48 0Z" fill="#e3ac5d"/>
    <path d="M68 0H105" stroke="#e3ac5d" stroke-width="2"/>
    <circle cx="112" cy="0" r="5" fill="#d25a4e"/>
    <text x="126" y="4" fill="#ddd6ca" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">TURN-BASED</text>
  </g>

  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <path d="M340 59H750" stroke="#c1a878" stroke-opacity=".22"/>
  <text x="344" y="48" fill="#d8d4ca" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">ASHLAND · PROTECT THE EMBER</text>
  <text x="746" y="48" fill="#e6ad60" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="end">MISSION 03 / 09</text>

  <!-- Eight-by-eight tactical board with cover, flame hazards, allies, and raiders. -->
  <rect x="342" y="66" width="152" height="152" rx="5" fill="url(#map)" stroke="#73808a" stroke-opacity=".65"/>
  <rect x="342" y="66" width="152" height="152" rx="5" fill="url(#ash)"/>
  <g fill="#55606c">
    <rect x="361" y="85" width="19" height="19"/><rect x="418" y="85" width="19" height="19"/>
    <rect x="380" y="123" width="19" height="19"/><rect x="437" y="123" width="19" height="19"/>
    <rect x="361" y="161" width="19" height="19"/><rect x="456" y="180" width="19" height="19"/>
  </g>
