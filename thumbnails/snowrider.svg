<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Snowrider</title>
  <desc id="desc">A sledder speeds down a snowy hill past pines toward a gift box.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2a40"/><stop offset=".57" stop-color="#2a5a80"/><stop offset="1" stop-color="#0d2a40"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ffd54f" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ffd54f" stroke-width="4"/>
