<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Floating Point Lab</title>
  <desc id="desc">A floating-point number with mantissa and exponent over a number line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17142a"/><stop offset=".57" stop-color="#241f3d"/><stop offset="1" stop-color="#17142a"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#818cf8" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#818cf8" stroke-width="4"/>
  <text x="52" y="51" fill="#818cf8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">NUMERICS LAB</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">FLOATING</text>
  <text x="50" y="160" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">POINT LAB</text>
  <text x="53" y="190" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">MANTISSA · EXPONENT · PRECISION</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#1e1b2e"/><rect x="360" y="60" width="370" height="110" rx="10" fill="#111827" stroke="#4c4670"/><text x="380" y="92" font-family="DejaVu Sans,Arial" font-size="16" fill="#e0e7ff">1.1011 × 2<tspan baseline-shift="super" font-size="11">3</tspan></text><text x="380" y="122" font-family="DejaVu Sans,Arial" font-size="13" fill="#a5b4fc">mantissa · exponent · sign</text><rect x="380" y="138" width="330" height="10" rx="5" fill="#2e2a45"/><rect x="380" y="138" width="270" height="10" rx="5" fill="#818cf8"/><line x1="380" y1="55" x2="710" y2="55" stroke="#818cf8" stroke-width="2"/><line x1="380" y1="50" x2="380" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="413" y1="50" x2="413" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="446" y1="50" x2="446" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="479" y1="50" x2="479" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="512" y1="50" x2="512" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="545" y1="50" x2="545" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="578" y1="50" x2="578" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="611" y1="50" x2="611" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="644" y1="50" x2="644" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="677" y1="50" x2="677" y2="60" stroke="#818cf8" stroke-width="2"/><line x1="710" y1="50" x2="710" y2="60" stroke="#818cf8" stroke-width="2"/><text x="545" y="200" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700" fill="#a5b4fc">precision fades at the edges</text>
  </g>
