<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Linux 6.1.14-rv32ima on scratch</title>
  <desc id="desc">A terminal shows a Linux 6.1.14 RISC-V kernel booting to a shell prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset=".57" stop-color="#1a1a1a"/><stop offset="1" stop-color="#050505"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#7CFC00" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#7CFC00" stroke-width="4"/>
  <text x="52" y="51" fill="#7CFC00" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">EMULATION · SCRATCH BUILD</text>
  <text x="50" y="106" fill="#eaffea" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">LINUX</text>
  <text x="50" y="152" fill="#eaffea" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">ON SCRATCH</text>
  <text x="53" y="182" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">RV32IMA · KERNEL 6.1.14 · TTY</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#0b0b0b"/><text x="340" y="52" font-family="monospace" font-size="12" fill="#cfcfcf">[    0.000000] Linux version 6.1.14 (rv32ima)</text><text x="340" y="73" font-family="monospace" font-size="12" fill="#cfcfcf">[    0.012000] Memory: 64MB available</text><text x="340" y="94" font-family="monospace" font-size="12" fill="#cfcfcf">[    0.233000] printk: console [tty0] enabled</text><text x="340" y="115" font-family="monospace" font-size="12" fill="#cfcfcf">[    1.102000] Run /init as init process</text><text x="340" y="136" font-family="monospace" font-size="12" fill="#7CFC00">Welcome to mini-rv32ima</text><text x="340" y="157" font-family="monospace" font-size="12" fill="#7CFC00"># uname -a</text><text x="340" y="178" font-family="monospace" font-size="12" fill="#7CFC00">Linux buildroot 6.1.14 riscv32 GNU/Linux</text><text x="340" y="199" font-family="monospace" font-size="12" fill="#7CFC00"># _</text><rect x="700" y="45" width="50" height="22" rx="4" fill="#ff8c1a"/><text x="725" y="60" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#fff">SCRATCH</text>
  </g>
</svg>
