<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Atari 2600 Emulator</title>
  <desc id="desc">A chunky CRT screen with colorful blocks beside a generic woodgrain console, with a note that no ROMs are included.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141414"/><stop offset=".57" stop-color="#3a2a1a"/><stop offset="1" stop-color="#141414"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ff8f00" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ff8f00" stroke-width="4"/>
  <text x="52" y="51" fill="#ff8f00" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">RETRO EMULATOR · BYOROM</text>
  <text x="50" y="106" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">2600</text>
  <text x="50" y="152" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">EMULATOR</text>
  <text x="53" y="182" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">JAVATARI · LOAD YOUR OWN ROM</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#1a1a1f"/><rect x="360" y="50" width="250" height="160" rx="6" fill="#000" stroke="#555" stroke-width="6"/><rect x="366" y="56" width="24" height="32" fill="#e53935"/><rect x="396" y="92" width="24" height="32" fill="#fb8c00"/><rect x="426" y="128" width="24" height="32" fill="#fdd835"/><rect x="456" y="164" width="24" height="32" fill="#43a047"/><rect x="486" y="56" width="24" height="32" fill="#1e88e5"/><rect x="516" y="92" width="24" height="32" fill="#8e24aa"/><rect x="546" y="128" width="24" height="32" fill="#e53935"/><rect x="576" y="164" width="24" height="32" fill="#fb8c00"/><rect x="366" y="180" width="238" height="24" fill="#6d4c41"/><rect x="460" y="120" width="12" height="12" fill="#fff"/><rect x="520" y="150" width="20" height="12" fill="#fff"/><rect x="640" y="150" width="110" height="46" rx="6" fill="#3a3a3a"/><rect x="640" y="160" width="110" height="18" fill="#8d5a2b"/><rect x="650" y="156" width="40" height="8" rx="2" fill="#e53935"/><circle cx="730" cy="173" r="8" fill="#333" stroke="#111" stroke-width="2"/><text x="695" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#cfd8dc" letter-spacing="1.5">ATARI 2600</text><text x="695" y="90" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#78909c">NO ROMS INCLUDED</text><text x="695" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#78909c">LOAD YOUR OWN FILE</text>
