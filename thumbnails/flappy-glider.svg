  <path d="M429 70H447M429 96H447M429 157H447M429 185H447" stroke="#baffdf" stroke-width="3" stroke-linecap="round"/>
  <path d="M569 65V108M569 144V212" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  <path d="M558 75H580M558 96H580M558 156H580M558 185H580" stroke="#fff0af" stroke-width="3" stroke-linecap="round"/>
