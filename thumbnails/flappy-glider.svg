  <rect x="714" y="77" width="25" height="22" rx="7" fill="#163b4a" stroke="#f6d477"/>
  <text x="726.5" y="92" fill="#ffdf7b" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" text-anchor="middle">×3</text>
  <rect x="2" y="2" width="796" height="256" rx="13" fill="none" stroke="#d7eee8" stroke-opacity=".16"/>
