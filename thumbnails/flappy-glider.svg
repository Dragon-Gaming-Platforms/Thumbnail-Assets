<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Flappy Glider</title>
  <desc id="desc">An original paper glider threads shifting wind gates, with a gold bonus gate, combo trail and protective feather.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081526"/><stop offset=".58" stop-color="#123950"/><stop offset="1" stop-color="#0a1e32"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b7291"/><stop offset="1" stop-color="#102d49"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ef1c8"/><stop offset="1" stop-color="#35a88f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe48a"/><stop offset="1" stop-color="#d99d3e"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d8eff5" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/><rect width="800" height="260" fill="url(#grid)"/>
  <path d="M0 228H800" stroke="#69ded0" stroke-opacity=".4"/><path d="M29 25V235" stroke="#55d9c7" stroke-width="4"/>
  <text x="52" y="51" fill="#77e7d4" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">WIND-GATE PILOT · 01</text>
  <text x="50" y="108" fill="#f1f8f4" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" letter-spacing="1.2">FLAPPY</text>
  <text x="50" y="157" fill="#f1f8f4" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="1.5">GLIDER</text>
  <text x="53" y="187" fill="#b9d7dd" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FLAP · THREAD · CLIMB</text>
  <g transform="translate(57 212)">
    <path d="M0-8H18V8H0Z" fill="none" stroke="#69e1c5" stroke-width="2"/><path d="M26 0H55" stroke="#69e1c5" stroke-width="2"/>
    <path d="M64-8Q78 0 64 8Q79 4 82 0Q78-4 64-8Z" fill="#ffd46e"/><path d="M91 0H120" stroke="#ffd46e" stroke-width="2"/>
    <text x="130" y="4" fill="#d4e5e5" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing=".9">GOLD GATE · COMBO</text>
  </g>

  <rect x="322" y="28" width="446" height="204" rx="17" fill="#0d263b" stroke="#4f91a2" stroke-opacity=".85"/>
  <path d="M340 59H750" stroke="#abd8dd" stroke-opacity=".25"/>
  <text x="344" y="48" fill="#d7eeea" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">WIND GATE RUN</text>
  <text x="746" y="48" fill="#f6d477" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1" text-anchor="end">STREAK MULTIPLIER</text>
  <rect x="340" y="65" width="410" height="148" rx="8" fill="url(#sky)"/>
  <circle cx="685" cy="92" r="18" fill="#ffe28c" opacity=".95"/>
