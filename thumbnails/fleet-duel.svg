  <text x="746" y="48" fill="#e7c779" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1" text-anchor="end">REGION 03 / 06</text>
  <rect x="344" y="68" width="144" height="144" rx="5" fill="url(#sea)" stroke="#5e9cab"/>
