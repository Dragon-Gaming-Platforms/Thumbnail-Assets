<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Fleet Duel</title>
  <desc id="desc">A stylized eight-by-eight naval campaign map with reef hazards, opposing fleets and a sonar sweep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081925"/><stop offset=".58" stop-color="#123544"/><stop offset="1" stop-color="#0b1e2c"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b586e"/><stop offset="1" stop-color="#0b293a"/></linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#b7dbe2" stroke-opacity=".2"/></pattern>
    <radialGradient id="sonar"><stop stop-color="#6ee8da" stop-opacity=".25"/><stop offset="1" stop-color="#6ee8da" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/><path d="M0 228H800" stroke="#e6bd6e" stroke-opacity=".35"/><path d="M29 25V235" stroke="#55cfc7" stroke-width="4"/>
