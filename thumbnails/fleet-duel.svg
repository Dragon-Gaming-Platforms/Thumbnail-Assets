  <g fill="#d2b170" opacity=".9"><rect x="380" y="86" width="18" height="18"/><rect x="398" y="86" width="18" height="18"/><rect x="434" y="158" width="18" height="18"/><rect x="452" y="158" width="18" height="18"/></g>
  <circle cx="414" cy="140" r="56" fill="url(#sonar)"/>
