  <text x="50" y="108" fill="#eef7f3" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="1.4">FLEET</text>
  <text x="50" y="157" fill="#eef7f3" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="2">DUEL</text>
  <text x="53" y="187" fill="#b7d0d6" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SCAN · AIM · SURVIVE</text>
