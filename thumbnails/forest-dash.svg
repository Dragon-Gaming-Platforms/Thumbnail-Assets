    <path d="M-12-25Q-2-39 13-27L18-21L8-19L0-24L-8-18Z" fill="#43805a"/>
    <circle cx="-4" cy="-18" r="2" fill="#18241f"/><circle cx="8" cy="-18" r="2" fill="#18241f"/>
    <path d="M-10 18L-17 30M9 18L18 27M-13-3L-25 4M13-3L26-10" stroke="#58402d" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M390 173H441L449 182H390Z" fill="#98603c" stroke="#e5bf79" stroke-width="2"/><ellipse cx="393" cy="177" rx="5" ry="6" fill="#d49b5b"/>
  <path d="M637 143V117M704 143V117M637 117Q669 93 704 117" fill="none" stroke="#315c3d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="609" cy="157" r="7" fill="#edc75e"/><path d="M605 157Q609 150 613 157L609 163Z" fill="#fff2bc"/>
  <circle cx="628" cy="174" r="6" fill="#edc75e"/><path d="M624 174Q628 168 632 174L628 179Z" fill="#fff2bc"/>
  <rect x="714" y="77" width="23" height="23" rx="7" fill="#193b31" stroke="#9ed28b"/><path d="M725 81L732 84V91Q730 96 725 98Q720 96 718 91V84Z" fill="none" stroke="#9ed28b" stroke-width="1.5"/>
  <rect x="2" y="2" width="796" height="256" rx="13" fill="none" stroke="#e0ead4" stroke-opacity=".15"/>
</svg>
