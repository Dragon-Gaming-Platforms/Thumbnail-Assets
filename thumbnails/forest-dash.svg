  <g transform="translate(548 149)">
    <ellipse cx="0" cy="33" rx="22" ry="6" fill="#10231d" opacity=".35"/>
    <path d="M-14 3Q-22-18-6-29Q12-36 18-15L14 18Q4 28-10 17Z" fill="#a96237" stroke="#6f432b" stroke-width="2"/>
