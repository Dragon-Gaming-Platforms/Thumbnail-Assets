<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Mega Drive / Genesis Emulator</title>
  <desc id="desc">A CRT screen with a 16-bit style skyline beside a generic black console, with a note that no ROMs are included.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a14"/><stop offset=".57" stop-color="#1a2040"/><stop offset="1" stop-color="#0a0a14"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#1e88e5" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#1e88e5" stroke-width="4"/>
  <text x="52" y="51" fill="#1e88e5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">RETRO EMULATOR · BYOROM</text>
  <text x="50" y="106" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">16-BIT</text>
  <text x="50" y="152" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" letter-spacing="1.2">EMULATOR</text>
  <text x="53" y="182" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">EXPERIMENTAL · LOAD YOUR OWN ROM</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
