<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Floppy Bird Canvas</title>
  <desc id="desc">A round red bird flaps between green pipes on a pale sky.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102030"/><stop offset=".57" stop-color="#20405a"/><stop offset="1" stop-color="#102030"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ff5252" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ff5252" stroke-width="4"/>
