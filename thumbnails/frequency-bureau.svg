  <text x="621" y="83" fill="#9fb9c5" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing=".9">CHANNEL SET</text>
  <g transform="translate(622 96)">
    <rect width="112" height="20" rx="6" fill="#163243" stroke="#3c6075"/><circle cx="12" cy="10" r="5" fill="#56d6c8"/><text x="24" y="13" fill="#d8e8e7" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700">CHANNEL 1</text>
    <rect y="25" width="112" height="20" rx="6" fill="#163243" stroke="#3c6075"/><circle cx="12" cy="35" r="5" fill="#e8bc59"/><text x="24" y="38" fill="#d8e8e7" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700">CHANNEL 2</text>
