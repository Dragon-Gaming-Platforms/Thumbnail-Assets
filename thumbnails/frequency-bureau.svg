    <rect y="75" width="112" height="20" rx="6" fill="#163243" stroke="#3c6075"/><circle cx="12" cy="85" r="5" fill="#65a9e7"/><text x="24" y="88" fill="#d8e8e7" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700">CHANNEL 4</text>
