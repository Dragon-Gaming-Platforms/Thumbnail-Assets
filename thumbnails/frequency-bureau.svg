    <circle cx="467" cy="95" r="10" fill="#cc82dd" stroke="#f3d9fb" stroke-width="2"/><circle cx="500" cy="124" r="12" fill="#65a9e7" stroke="#fff" stroke-width="3"/>
    <circle cx="482" cy="167" r="10" fill="#56d6c8" stroke="#e4ffef" stroke-width="2"/><circle cx="434" cy="181" r="10" fill="#cc82dd" stroke="#f3d9fb" stroke-width="2"/>
