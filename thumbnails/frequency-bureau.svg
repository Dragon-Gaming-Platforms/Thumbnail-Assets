<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Frequency Bureau</title>
  <desc id="desc">An abstract channel-assignment puzzle: connected city stations use colored channels while ordinary and strong interference links are resolved.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111725"/><stop offset=".55" stop-color="#18283a"/><stop offset="1" stop-color="#10202e"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142b3b"/><stop offset="1" stop-color="#0d1d2a"/></linearGradient>
    <pattern id="mapgrid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#b6d5de" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/><path d="M0 228H800" stroke="#67d8d2" stroke-opacity=".34"/><path d="M29 25V235" stroke="#65d7d2" stroke-width="4"/>
  <text x="52" y="51" fill="#79e2dc" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SIGNAL CONTROL · 01</text>
  <text x="50" y="108" fill="#f0f4eb" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="800" letter-spacing=".3">FREQUENCY</text>
  <text x="50" y="157" fill="#f0f4eb" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.6">BUREAU</text>
  <text x="53" y="187" fill="#b9c9d3" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15">ASSIGN · BALANCE · VERIFY</text>
  <g transform="translate(55 212)">
    <circle cx="0" cy="0" r="5" fill="#55d5c8"/><path d="M10 0H35" stroke="#55d5c8" stroke-width="2"/>
    <circle cx="43" cy="0" r="5" fill="#e8bc59"/><path d="M53 0H78" stroke="#e8bc59" stroke-width="2"/>
    <circle cx="86" cy="0" r="5" fill="#cc82dd"/>
    <text x="101" y="4" fill="#d6e0e0" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing=".75">12 MAPS · 3–5 CHANNELS</text>
  </g>

  <rect x="322" y="28" width="446" height="204" rx="17" fill="url(#panel)" stroke="#607f91" stroke-opacity=".82"/>
  <path d="M340 59H750" stroke="#adc4d2" stroke-opacity=".23"/>
  <text x="344" y="48" fill="#d8e5e8" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.25">ABSTRACT INTERFERENCE MAP</text>
  <text x="746" y="48" fill="#e5c46e" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1" text-anchor="end">PUZZLE 07 / 12</text>
  <rect x="340" y="66" width="410" height="147" rx="8" fill="#0d1c29"/><rect x="340" y="66" width="410" height="147" rx="8" fill="url(#mapgrid)"/>
  <path d="M340 179L386 150L415 173L454 140L491 170L527 142L566 172L605 134L644 171L690 147L750 181" fill="none" stroke="#325268" stroke-width="2" opacity=".65"/>
  <g fill="#243b4b" opacity=".75"><path d="M350 155V123H368V155ZM373 155V111H395V155ZM402 155V130H417V155ZM575 156V120H596V156ZM602 156V102H625V156ZM633 156V128H648V156ZM692 158V115H716V158Z"/></g>
