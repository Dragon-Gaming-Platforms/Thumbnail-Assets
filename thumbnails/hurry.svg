<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Hurry! 10-Second Panic</title>
  <desc id="desc">A big countdown clock reading ten surrounded by warning triangles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a0a0a"/><stop offset=".57" stop-color="#7a1a1a"/><stop offset="1" stop-color="#3a0a0a"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ffeb3b" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ffeb3b" stroke-width="4"/>
  <text x="52" y="51" fill="#ffeb3b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">MINI-GAME PANIC</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">HURRY!</text>
  <text x="53" y="140" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">TEN SECONDS · EVERY LEVEL</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#ff5252"/><circle cx="545" cy="130" r="70" fill="#fff"/><circle cx="545" cy="130" r="60" fill="none" stroke="#ff1744" stroke-width="10" stroke-dasharray="300 377" transform="rotate(-90 545 130)"/><text x="545" y="148" text-anchor="middle" font-family="Arial" font-size="52" font-weight="900" fill="#d50000">10</text><polygon points="380,66 392,88 368,88" fill="#ffeb3b" stroke="#333" stroke-width="2"/><polygon points="700,176 712,198 688,198" fill="#ffeb3b" stroke="#333" stroke-width="2"/><polygon points="400,186 412,208 388,208" fill="#ffeb3b" stroke="#333" stroke-width="2"/><polygon points="720,56 732,78 708,78" fill="#ffeb3b" stroke="#333" stroke-width="2"/>
  </g>
</svg>
