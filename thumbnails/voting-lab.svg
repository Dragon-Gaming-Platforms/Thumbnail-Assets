<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Voting Lab</title>
  <desc id="desc">A ballot dropping into a box with tally bars beside it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset=".57" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#38bdf8" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#38bdf8" stroke-width="4"/>
  <text x="52" y="51" fill="#38bdf8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">CIVICS LAB</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">VOTING</text>
  <text x="50" y="160" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">LAB</text>
  <text x="53" y="190" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">BALLOTS · TALLIES · CHOICE</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#1f2937"/><rect x="360" y="120" width="200" height="90" rx="8" fill="#374151"/><rect x="360" y="120" width="200" height="16" fill="#4b5563"/><rect x="430" y="80" width="60" height="44" rx="4" fill="#f8fafc"/><line x1="440" y1="92" x2="480" y2="92" stroke="#9ca3af" stroke-width="2"/><line x1="440" y1="102" x2="480" y2="102" stroke="#9ca3af" stroke-width="2"/><line x1="440" y1="112" x2="470" y2="112" stroke="#9ca3af" stroke-width="2"/><rect x="600" y="60" width="150" height="18" rx="9" fill="#38bdf8"/><text x="600" y="52" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#e5e7eb">A · 62%</text><rect x="600" y="100" width="110" height="18" rx="9" fill="#f472b6"/><text x="600" y="92" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#e5e7eb">B · 45%</text><rect x="600" y="140" width="70" height="18" rx="9" fill="#fbbf24"/><text x="600" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#e5e7eb">C · 29%</text>
