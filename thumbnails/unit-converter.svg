<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Unit Converter</title>
  <desc id="desc">An input of 12.5 km converted to 7.767 mi above category chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".57" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#22c55e" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#22c55e" stroke-width="4"/>
  <text x="52" y="51" fill="#22c55e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">OFFLINE UTILITY</text>
