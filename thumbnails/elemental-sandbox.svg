<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Elemental Sandbox</title>
  <desc id="desc">A pixel-grid particle lab with sand, water, fire, plants and steam reactions, inspired by the game's cellular-material sandbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset=".55" stop-color="#17202c"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15232b"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <pattern id="cells" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#a7bbca" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <radialGradient id="heat">
      <stop offset="0" stop-color="#ff7048" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff7048" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#6acbd5" stroke-opacity=".32"/>
  <path d="M29 25V235" stroke="#6acbd5" stroke-width="4"/>

  <text x="52" y="51" fill="#8fe1eb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">PARTICLE LAB · 01</text>
  <text x="50" y="108" fill="#f3f5eb" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing=".4">ELEMENTAL</text>
  <text x="50" y="157" fill="#f3f5eb" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="1.8">SANDBOX</text>
  <text x="53" y="187" fill="#b9c9d1" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">FALL · FLOW · REACT</text>
  <g transform="translate(56 212)">
    <rect x="-5" y="-5" width="10" height="10" fill="#d7b85c"/>
    <rect x="21" y="-5" width="10" height="10" fill="#368bd3"/>
    <rect x="47" y="-5" width="10" height="10" fill="#ff7048"/>
    <rect x="73" y="-5" width="10" height="10" fill="#4ec36a"/>
    <path d="M95 0H152" stroke="#b8c9d0" stroke-opacity=".4" stroke-dasharray="2 5"/>
    <text x="162" y="4" fill="#d7e3e1" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">ELEMENTS</text>
  </g>

  <rect x="322" y="28" width="446" height="204" rx="17" fill="#101b25" stroke="#607c88" stroke-opacity=".8"/>
  <path d="M340 59H750" stroke="#8da9b0" stroke-opacity=".25"/>
  <text x="344" y="48" fill="#d7e7e7" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">DRAW A MATERIAL · WATCH THE REACTION</text>

  <rect x="341" y="66" width="281" height="146" rx="7" fill="url(#glass)" stroke="#506775"/>
  <rect x="341" y="66" width="281" height="146" rx="7" fill="url(#cells)"/>
  <circle cx="495" cy="145" r="82" fill="url(#heat)"/>
