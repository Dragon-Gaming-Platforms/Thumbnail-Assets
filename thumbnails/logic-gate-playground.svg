<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Logic Gate Playground</title>
  <desc id="desc">Three inputs feed AND, OR, NOT and XOR gates wired to a lit output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".57" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#22c55e" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#22c55e" stroke-width="4"/>
  <text x="52" y="51" fill="#22c55e" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">BOOLEAN CIRCUIT LAB</text>
  <text x="50" y="102" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" letter-spacing="1.2">LOGIC GATE</text>
  <text x="50" y="138" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" letter-spacing="1.2">PLAYGROUND</text>
  <text x="53" y="168" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">AND · OR · NOT · XOR</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#0f172a"/><circle cx="360" cy="70" r="10" fill="#22c55e"/><text x="360" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text><circle cx="360" cy="120" r="10" fill="#334155"/><text x="360" y="124" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fff">0</text><circle cx="360" cy="170" r="10" fill="#22c55e"/><text x="360" y="174" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text><path d="M370 70H430M370 120H430V104M370 170H520V154M480 96H520M480 146H560V130M620 120H690" stroke="#94a3b8" stroke-width="2" fill="none"/><rect x="430" y="80" width="50" height="34" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="455" y="102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">AND</text><rect x="430" y="130" width="50" height="34" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="455" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">OR</text><rect x="520" y="80" width="50" height="34" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="545" y="102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">NOT</text><rect x="520" y="130" width="50" height="34" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="545" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">XOR</text><rect x="570" y="103" width="50" height="34" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="595" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">AND</text><circle cx="700" cy="120" r="14" fill="#22c55e"/><text x="700" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
