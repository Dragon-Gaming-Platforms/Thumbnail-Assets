<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Tunneling Lab</title>
  <desc id="desc">A wave packet passing through a barrier it should not cross.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".57" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#38bdf8" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#38bdf8" stroke-width="4"/>
  <text x="52" y="51" fill="#38bdf8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">QUANTUM LAB</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">QUANTUM</text>
  <text x="50" y="160" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" letter-spacing="1.2">TUNNELING LAB</text>
  <text x="53" y="190" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">WAVES · BARRIERS · TUNNELING</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#0f172a"/><line x1="350" y1="200" x2="740" y2="200" stroke="#475569" stroke-width="2"/><rect x="520" y="90" width="26" height="110" fill="#ef4444" fill-opacity=".7"/><text x="533" y="82" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#ef4444">barrier</text><path d="M360 150 C 380 110 400 110 415 150 C 430 190 450 190 465 150 C 480 110 500 110 515 150" fill="none" stroke="#38bdf8" stroke-width="2.5"/><path d="M560 150 C 575 125 590 125 605 150 C 620 175 635 175 650 150" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity=".7"/><circle cx="415" cy="150" r="4" fill="#bae6fd"/><circle cx="605" cy="150" r="4" fill="#bae6fd"/><text x="415" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#94a3b8">in</text><text x="605" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="11" font-weight="700" fill="#94a3b8">tunneled</text>
