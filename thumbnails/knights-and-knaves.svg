<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Knights and Knaves</title>
  <desc id="desc">Two figures make conflicting statements in speech bubbles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1410"/><stop offset=".57" stop-color="#3a2a20"/><stop offset="1" stop-color="#1a1410"/></linearGradient>

  </defs>
  <rect width="800" height="260" fill="url(#bg)"/>
  <path d="M0 228H800" stroke="#ffcc80" stroke-opacity=".35"/>
  <path d="M29 25V235" stroke="#ffcc80" stroke-width="4"/>
  <text x="52" y="51" fill="#ffcc80" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">LOGIC RIDDLES</text>
  <text x="50" y="110" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">KNIGHTS</text>
  <text x="50" y="160" fill="#f5eee1" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" letter-spacing="1.2">&amp; KNAVES</text>
  <text x="53" y="190" fill="#c8c4ba" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">TRUTH-TELLERS · LIARS · DEDUCE</text>
  <rect x="322" y="28" width="446" height="204" rx="17" fill="#141b25" stroke="#6b6670" stroke-opacity=".8"/>
  <clipPath id="pc"><rect x="323" y="29" width="444" height="202" rx="16"/></clipPath>
  <g clip-path="url(#pc)">
<rect x="323" y="29" width="444" height="202" fill="#fdf6e3"/><circle cx="430" cy="130" r="18" fill="#1565c0"/><rect x="408" y="150" width="44" height="50" rx="10" fill="#1565c0"/><rect x="360" y="55" width="140" height="40" rx="8" fill="#fff" stroke="#333"/><path d="M424 95l6 12 6-12z" fill="#fff" stroke="#333"/><text x="430" y="80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#333">I always tell the truth</text><circle cx="630" cy="130" r="18" fill="#c62828"/><rect x="608" y="150" width="44" height="50" rx="10" fill="#c62828"/><rect x="560" y="55" width="140" height="40" rx="8" fill="#fff" stroke="#333"/><path d="M624 95l6 12 6-12z" fill="#fff" stroke="#333"/><text x="630" y="80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#333">A is lying!</text><text x="430" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1565c0">KNIGHT?</text><text x="630" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#c62828">KNAVE?</text>
  </g>
</svg>
